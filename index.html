<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta property="og:title" content="Vertopia.io">
    <meta property="og:description" content="An inspired multiplayer io game">
    <meta property="og:image" content="https://omriex.github.io/vertopia-io/Vertopia.png">
    <meta property="og:url" content="https://omriex.github.io/vertopia-io/">
    <meta name="theme-color" content="#4CAF50">
    <meta name="twitter:card" content="summary_large_image">
    
    <title>Vertopia.io</title>
    <link rel="icon" type="image/png" href="Vertopia.png">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
        }

        #uiLayer {
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        #mainMenu {
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: auto;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 50px 100px;
            border-radius: 15px;
            position: relative;
        }

        h1 {
            color: #ffffff;
            font-size: 4rem;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .version-text {
            color: #aaaaaa;
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        #playerNameInput {
            padding: 12px 20px;
            font-size: 1.5rem;
            border-radius: 8px;
            border: none;
            margin-bottom: 25px;
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            outline: none;
            font-weight: bold;
            width: 100%;
        }

        #playerNameInput:focus {
            background: #fff;
        }

        #playBtn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 15px 60px;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: transform 0.15s ease-in-out;
            width: 100%;
            backface-visibility: hidden;
            transform: translateZ(0);
        }

        #playBtn:hover {
            transform: scale(0.95) translateZ(0);
        }

        #playBtn:disabled {
            background-color: #777;
            cursor: not-allowed;
            transform: translateZ(0);
        }

        #locationOverlay {
            display: none;
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: auto;
            gap: 20px; 
        }
        
        .loc-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px 30px;
            font-size: 22px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.15s ease-in-out;
            backface-visibility: hidden;
            transform: translateZ(0);
        }
        
        .loc-btn svg { width: 32px; height: 32px; fill: white; margin-right: 12px; }
        .loc-btn-pick { background-color: #5b3b9b; }
        .loc-btn-spawn { background-color: #fb6c6c; }
        .loc-btn:hover { transform: scale(0.95) translateZ(0); }

        .spawn-menu-wrapper {
            display: flex;
            pointer-events: auto;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            padding: 25px;
            font-family: inherit;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            gap: 20px;
        }

        .sm-close-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background-color: #800000;
            border: none;
            border-radius: 8px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s ease-in-out;
            z-index: 10;
            backface-visibility: hidden;
            transform: translateZ(0);
        }

        .sm-close-btn:hover {
            transform: scale(0.95) translateZ(0);
        }

        .sm-close-btn svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        #sm-left {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .sm-top-controls, .sm-bot-controls { display: flex; justify-content: center; width: 100%; }
        .sm-mid-controls { display: flex; align-items: center; justify-content: center; margin: 10px 0; }

        .sm-arrow-btn {
            background-color: rgba(0, 0, 0, 0.4);
            border: none;
            border-radius: 8px;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s ease-in-out;
            backface-visibility: hidden;
            transform: translateZ(0);
        }
        
        .sm-arrow-btn:hover {
            transform: scale(0.95) translateZ(0);
        }
        
        .sm-arrow-btn svg {
            width: 28px;
            height: 28px;
            fill: white;
        }

        #sm-grid {
            display: grid;
            grid-template-columns: repeat(5, 55px);
            gap: 5px;
            margin: 0 15px;
        }

        .sm-grid-cell {
            background-color: rgba(255, 255, 255, 0.1);
            border: 2px solid transparent; 
            border-radius: 6px;
            height: 55px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            gap: 2px;
            padding: 2px;
            transition: transform 0.15s ease-in-out, background-color 0.1s;
            backface-visibility: hidden;
            transform: translateZ(0);
        }

        .sm-grid-cell:not(.disabled):hover { 
            transform: scale(0.95) translateZ(0);
        }

        .sm-grid-cell.disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .sm-grid-cell span {
            color: #ddd;
            width: 100%;
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            pointer-events: none;
        }

        .sm-grid-cell.active {
            background-color: rgba(106, 155, 73, 0.5);
        }
        .sm-grid-cell.active span { color: #fff; }

        #sm-right {
            width: 250px;
            display: flex;
            flex-direction: column;
            border-left: 2px solid rgba(255, 255, 255, 0.2);
            padding-left: 20px;
        }

        .sm-main-btn {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            border: none;
            border-radius: 8px;
            text-transform: uppercase;
            justify-content: flex-start;
            margin-bottom: 15px;
            transition: transform 0.15s ease-in-out;
            backface-visibility: hidden;
            transform: translateZ(0);
        }
        
        .sm-main-btn:hover { transform: scale(0.95) translateZ(0); }

        .sm-main-btn svg { width: 24px; height: 24px; margin-right: 10px; fill: white; }

        .btn-bed { 
            background-color: #333; 
            opacity: 0.5; 
            pointer-events: none; 
            cursor: not-allowed; 
        }
        
        .btn-rand { 
            background-color: #4a4a4a; 
            margin-top: auto; 
        }
        
        .btn-prev { 
            background-color: #588a4f; 
            margin-bottom: 0; 
        }

        .sm-hr { height: 2px; background-color: rgba(255, 255, 255, 0.2); margin: 15px 0; border: none; }

        .sm-title { text-align: center; font-size: 18px; margin-bottom: 10px; font-weight: bold; color: white; }

        .sm-field { display: flex; align-items: center; margin-bottom: 8px; font-size: 14px; color: white; }
        .sm-field span { width: 35px; font-weight: bold; }
        
        .sm-input {
            background-color: rgba(0, 0, 0, 0.5);
            color: #fff;
            flex-grow: 1;
            padding: 6px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            font-family: inherit;
            font-weight: bold;
            outline: none;
            font-size: 14px;
        }
        
        .sm-input:focus { border-color: #fff; }
        
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }

        .sm-field .sm-readonly {
            background-color: rgba(255, 255, 255, 0.1);
            color: #bbb;
            flex-grow: 1;
            padding: 6px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        #inventory {
            display: none; 
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 10px;
            gap: 10px;
            pointer-events: auto;
        }

        .inventory-slot {
            width: 60px;
            height: 60px;
            border: 3px solid gray; 
            border-radius: 5px;
            transition: border-color 0.2s ease, background-color 0.2s ease;
            cursor: pointer;
            background-color: rgba(255, 255, 255, 0.05); 
        }
        .inventory-slot:hover { border-color: white; }
        .inventory-slot.active { border-color: white; background-color: rgba(255, 255, 255, 0.2); }

        #minimapContainer {
            display: none;
            position: absolute;
            top: 20px;
            left: 20px;
            width: 160px;
            height: 160px;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            pointer-events: auto;
        }
        #minimapDot {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 3px rgba(0,0,0,0.8);
        }

        #coordsContainer {
            display: none;
            position: absolute;
            top: 20px;
            left: 200px;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            padding: 10px 15px;
            pointer-events: auto;
            color: white;
            font-size: 15px;
            font-weight: bold;
            gap: 15px;
            align-items: center;
        }
        .coord-x { color: #ff4d4d; }
        .coord-y { color: #4da6ff; }

        #perfContainer {
            display: none;
            position: absolute;
            top: 70px;
            left: 200px;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            padding: 10px 15px;
            pointer-events: auto;
            color: white;
            font-size: 15px;
            font-weight: bold;
            gap: 15px;
            align-items: center;
        }

        #craftBtnContainer {
            display: none;
            position: absolute;
            top: 120px;
            left: 200px;
            width: 44px;
            height: 44px;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            pointer-events: auto;
            cursor: pointer;
            transition: transform 0.15s ease-in-out;
            align-items: center;
            justify-content: center;
            backface-visibility: hidden;
            transform: translateZ(0);
        }
        #craftBtnContainer:hover {
            transform: scale(0.95) translateZ(0);
        }

        #leaderboardContainer {
            display: none;
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.5); 
            border-radius: 10px;
            width: 220px;
            pointer-events: auto;
            color: white;
            padding: 15px;
            overflow: hidden;
        }
        #leaderboardHeader { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 1.1rem; }
        #leaderboardToggleBtn { background: none; border: none; color: white; cursor: pointer; font-size: 1.2rem; padding: 0; line-height: 1; transition: transform 0.3s ease-in-out; }
        #leaderboardToggleBtn:hover { opacity: 0.7; }
        #leaderboardToggleBtn.up { transform: rotate(180deg); }
        #listWrapper { max-height: 400px; transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease, max-height 0.35s ease, margin 0.35s ease; transform: translateX(0); opacity: 1; margin-top: 10px; }
        #listWrapper.closed { transform: translateX(120%); opacity: 0; max-height: 0; margin-top: 0; }
        #leaderboardList { list-style: decimal inside; padding: 0; margin: 0; font-size: 1rem; }
        #leaderboardList li { padding: 6px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        #leaderboardList li:last-child { border-bottom: none; }

        #statsContainer {
            display: none;
            position: absolute;
            bottom: 20px;
            left: 20px;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            padding: 15px;
            width: 220px;
            flex-direction: column;
            gap: 12px;
            pointer-events: auto;
        }
        .stat-row { display: flex; align-items: center; gap: 10px; }
        .stat-icon { width: 20px; height: 20px; filter: drop-shadow(0px 0px 2px rgba(0,0,0,0.8)); }
        .stat-bar-bg { flex-grow: 1; height: 12px; background-color: rgba(0, 0, 0, 0.6); border: 2px solid #222; border-radius: 6px; overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,0.8); }
        .stat-fill { height: 100%; width: 100%; transition: width 0.1s linear; }
        .health-fill { background-color: #ff3333; }
        .energy-fill { background-color: #ffcc00; }

        #craftingUI {
            display: none;
            flex-direction: column;
            width: max-content;
            gap: 20px;
            z-index: 100;
            top: 42%;
        }
        
        .crafting-grid {
            display: grid;
            gap: 10px;
            justify-content: center;
        }
        
        .craft-1x3 { grid-template-columns: repeat(1, 60px); }
        .craft-2x2 { grid-template-columns: repeat(2, 60px); }
        .craft-6x2 { grid-template-columns: repeat(6, 60px); }
        .craft-5x1 { grid-template-columns: repeat(5, 60px); }
        
        #chatInputContainer {
            display: none;
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: auto;
            z-index: 200;
        }
        
        #chatInput {
            padding: 12px 20px;
            font-size: 1.2rem;
            border-radius: 8px;
            border: none;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            outline: none;
            font-weight: bold;
            width: 400px;
            text-align: center;
            font-family: inherit;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        
        #chatInput::placeholder {
            color: #aaa;
        }

        #turnstileOverlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: auto;
            z-index: 50;
        }

        #loginBtn {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 0 15px;
            height: 44px;
            background-color: rgba(0, 0, 0, 0.5);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            transition: transform 0.15s ease-in-out;
            backface-visibility: hidden;
            transform: translateZ(0);
        }

        #loginBtn:hover {
            transform: scale(0.95) translateZ(0);
        }

        #loginBtn svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" tabindex="0"></canvas>

    <div id="uiLayer">
        <div id="turnstileOverlay">
            <div class="cf-turnstile" data-sitekey="0x4AAAAAAD_AIacd7oAQE9Ue" data-callback="onTurnstileSuccess"></div>
        </div>
        <div id="mainMenu">
            <button id="loginBtn">
                <svg viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                <span class="login-text">Login</span>
            </button>
            <h1>VERTOPIA.IO</h1>
            <div class="version-text">v1.0.9</div>
            <input type="text" id="playerNameInput" placeholder="Your name" maxlength="15" autocomplete="off">
            <button id="playBtn" disabled>LOADING...</button>
        </div>
        
        <div id="locationOverlay">
            <button class="loc-btn loc-btn-pick" id="btnPickLocation">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                PICK LOCATION
            </button>
            <button class="loc-btn loc-btn-spawn" id="btnSpawnHere">
                <svg viewBox="0 0 24 24"><path d="M20 12l-1.41-1.41L13 16.17V4h-2v12.17l-5.58-5.59L4 12l8 8 8-8z"/></svg>
                SPAWN HERE
            </button>
        </div>

        <div id="spawnMenuUI" class="spawn-menu-wrapper" style="display:none;">
            <button class="sm-close-btn" id="smCloseBtn">
                <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
            
            <div id="sm-left">
                <div class="sm-top-controls">
                    <button class="sm-arrow-btn" id="smUp">
                        <svg viewBox="0 0 24 24"><path d="M12 4l-8 8h6v8h4v-8h6z"/></svg>
                    </button>
                </div>
                <div class="sm-mid-controls">
                    <button class="sm-arrow-btn" id="smLeft">
                        <svg viewBox="0 0 24 24"><path d="M4 12l8 8v-6h8v-4h-8V4z"/></svg>
                    </button>
                    <div id="sm-grid"></div>
                    <button class="sm-arrow-btn" id="smRight">
                        <svg viewBox="0 0 24 24"><path d="M20 12l-8-8v6H4v4h8v6z"/></svg>
                    </button>
                </div>
                <div class="sm-bot-controls">
                    <button class="sm-arrow-btn" id="smDown">
                        <svg viewBox="0 0 24 24"><path d="M12 20l8-8h-6V4h-4v8H4z"/></svg>
                    </button>
                </div>
            </div>
            
            <div id="sm-right">
                <div class="sm-main-btn btn-bed" id="smBed">
                    <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
                    YOUR BED
                </div>
                
                <hr class="sm-hr">
                
                <div class="sm-title">REGION</div>
                <div class="sm-field"><span>X:</span><input type="number" id="smRegX" class="sm-input" value="0"></div>
                <div class="sm-field"><span>Z:</span><input type="number" id="smRegZ" class="sm-input" value="0"></div>
                
                <hr class="sm-hr">
                
                <div class="sm-title">LOCATION (±50)</div>
                <div class="sm-field"><span>X:</span><div class="sm-readonly" id="smLocX">0</div></div>
                <div class="sm-field"><span>Z:</span><div class="sm-readonly" id="smLocZ">0</div></div>
                
                <div class="sm-main-btn btn-rand" id="smRand">
                    <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
                    RANDOM
                </div>
                <div class="sm-main-btn btn-prev" id="smPrev">
                    <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
                    <span style="font-size:24px;font-weight:bold;margin-right:5px;line-height:1;">?</span> PREVIEW
                </div>
            </div>
        </div>

        <div id="craftingUI" class="spawn-menu-wrapper">
            <div style="display: flex; flex-direction: row; align-items: center; justify-content: center; width: 100%; gap: 40px;">
                <div style="display: flex; flex-direction: row; align-items: center; gap: 15px;">
                    <div class="crafting-grid craft-1x3">
                        <div class="inventory-slot"></div>
                        <div class="inventory-slot"></div>
                        <div class="inventory-slot"></div>
                    </div>
                    <canvas id="previewCanvas" width="100" height="130" style="background-color: rgba(0, 0, 0, 0.4); border-radius: 5px; border: 3px solid rgba(128,128,128,0.5);"></canvas>
                </div>
                
                <div style="display: flex; flex-direction: row; align-items: center; gap: 15px;">
                    <div class="crafting-grid craft-2x2">
                        <div class="inventory-slot"></div>
                        <div class="inventory-slot"></div>
                        <div class="inventory-slot"></div>
                        <div class="inventory-slot"></div>
                    </div>
                    
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="rgba(255, 255, 255, 0.6)">
                        <path d="M4 11h10.586l-4.293-4.293 1.414-1.414L19.414 12l-7.707 7.707-1.414-1.414L14.586 13H4v-2z"/>
                    </svg>
                    
                    <div class="inventory-slot"></div>
                </div>

        const mapData = new Uint8Array(MAP_COLS * MAP_ROWS);
        const waterTiles = [];
        const trees = new Map();

        function generateMap() {
            let mapSeed = 54321;
            function seededRandom() {
                mapSeed = (mapSeed * 9301 + 49297) % 233280;
                return mapSeed / 233280;
            }

            function paintBlob(cx, cy, radius, tileType) {
                for (let y = -radius; y <= radius; y++) {
                    for (let x = -radius; x <= radius; x++) {
                        if (Math.abs(x) + Math.abs(y) <= radius) {
                            let mapX = Math.round(cx + x);
                            let mapY = Math.round(cy + y);
                            if (mapX >= 0 && mapX < MAP_COLS && mapY >= 0 && mapY < MAP_ROWS) {
                                let idx = mapY * MAP_COLS + mapX;
                                if (mapData[idx] !== tileType) {
                                    mapData[idx] = tileType;
                                    if (tileType === 1) waterTiles.push(idx);
                                }
                            }
                        }
                    }
                }
            }

            let numVerticalRivers = 50;
            let numHorizontalRivers = 50;
            for (let i = 0; i < numVerticalRivers; i++) {
                let startX1 = seededRandom() * (MAP_COLS - 20) + 10;
                let phase1 = seededRandom() * Math.PI * 2;
                let phase2 = seededRandom() * Math.PI * 2;
                for (let y = 0; y < MAP_ROWS; y++) {
                    let x = startX1 + Math.sin(y * 0.15 + phase1) * 6 + Math.cos(y * 0.05 + phase2) * 4;
                    paintBlob(x, y, 2, 1); 
                }
            }
            for (let i = 0; i < numHorizontalRivers; i++) {
                let startY2 = seededRandom() * (MAP_ROWS - 20) + 10;
                let phase3 = seededRandom() * Math.PI * 2;
                let phase4 = seededRandom() * Math.PI * 2;
                for (let x = 0; x < MAP_COLS; x++) {
                    let y = startY2 + Math.sin(x * 0.15 + phase3) * 6 + Math.cos(x * 0.05 + phase4) * 4;
                    paintBlob(x, y, 2, 1);
                }
            }
            for (let i = 0; i < waterTiles.length; i++) {
                let idx = waterTiles[i];
                let x = idx % MAP_COLS;
                let y = Math.floor(idx / MAP_COLS);
                for (let ny = -2; ny <= 2; ny++) {
                    for (let nx = -2; nx <= 2; nx++) {
                        if (nx * nx + ny * ny <= 4.84) { 
                            let mapX = x + nx;
                            let mapY = y + ny;
                            if (mapX >= 0 && mapX < MAP_COLS && mapY >= 0 && mapY < MAP_ROWS) {
                                let nIdx = mapY * MAP_COLS + mapX;
                                if (mapData[nIdx] === 0) mapData[nIdx] = 2; 
                            }
                        }
                    }
                }
            }

            for (let y = 0; y < MAP_ROWS - 1; y += 7) {
                for (let x = 0; x < MAP_COLS - 1; x += 7) {
                    if (seededRandom() < 0.390625) { 
                        let ox = Math.floor(seededRandom() * 5);
                        let oy = Math.floor(seededRandom() * 5);
                        let tx = x + ox;
                        let ty = y + oy;
                        
                        if (tx < MAP_COLS - 1 && ty < MAP_ROWS - 1) {
                            if (mapData[ty * MAP_COLS + tx] === 0 &&
                                mapData[ty * MAP_COLS + tx + 1] === 0 &&
                                mapData[(ty + 1) * MAP_COLS + tx] === 0 &&
                                mapData[(ty + 1) * MAP_COLS + tx + 1] === 0) {
                                
                                let maxHp = 5 + Math.floor(seededRandom() * 6);
                                let treeId = tx + "_" + ty;
                                trees.set(treeId, {
                                    id: treeId,
                                    x: tx * TILE_SIZE,
                                    y: ty * TILE_SIZE,
                                    cx: tx * TILE_SIZE + TILE_SIZE,
                                    cy: ty * TILE_SIZE + TILE_SIZE,
                                    hp: maxHp,
                                    maxHp: maxHp,
                                    hitAngle: 0,
                                    hitTimer: 0,
                                    deathTimer: 0,
                                    dead: false,
                                    visibleState: 0,
                                    inView: false
                                });
                            }
                        }
                    }
                }
            }
        }

            for (let r = 0; r < 50; r++) {
                for (let t = 0; t < Math.PI * 2; t += 0.5) {
                    let testX = Math.floor(spawnTileX + Math.cos(t) * r);
                    let testY = Math.floor(spawnTileY + Math.sin(t) * r);
                    if (testX >= 0 && testX < MAP_COLS && testY >= 0 && testY < MAP_ROWS) {
                        if (mapData[testY * MAP_COLS + testX] === 0) {
                            spawnTileX = testX;
                            spawnTileY = testY;
                            found = true;
                            break;
                        }
                    }
                }

        function getVolume(x, y) {
            if (x === undefined || y === undefined) return 1.0;
            if (gameState !== 'PLAYING' && gameState !== 'DEAD') return 0;
            let dx = (player.x + player.width / 2) - x;
            let dy = (player.y + player.height / 2) - y;
            let dist = Math.sqrt(dx * dx + dy * dy);
            let maxDist = 800;
            if (dist > maxDist) return 0;
            return Math.max(0, 1.0 - (dist / maxDist));
        }

        function playSound(audioInstance, x, y) {
            let vol = getVolume(x, y);
            if (vol <= 0) return;
            let sound = audioInstance.cloneNode();
            sound.volume = vol;
            let playPromise = sound.play();
            if (playPromise !== undefined) playPromise.catch(e => {});
        }

        function playSoundInstance(audioArray, x, y) {
            if (!audioArray || audioArray.length === 0) return null;
            let vol = getVolume(x, y);
            if (vol <= 0) return null;
            let sound = audioArray[Math.floor(Math.random() * audioArray.length)].cloneNode();
            sound.volume = vol;
            let playPromise = sound.play();
            if (playPromise !== undefined) playPromise.catch(e => {});
            return sound;
        }

        function attemptAttack() {
            if (player.swingTimer <= 0 && player.cooldownTimer <= 0 && player.energy >= 5) {
                player.swingTimer = 0.001; 
                player.cooldownTimer = player.swingCooldown;
                player.attackCounter++;
                playSound(assets.swingSound, player.x + player.width / 2, player.y + player.height / 2);
                player.energy -= 5;
                player.regenDelay = Math.max(player.regenDelay, 1.5);
                if (player.energy <= 0) {
                    player.energy = 0;
                    player.exhausted = true;
                    player.regenDelay = 5.0;
                }

                let pCX = player.x + player.width / 2;
                let pCY = player.y + player.height / 2;
                let hitRange = 94;
                let hitArc = Math.PI / 1.5; 
                
                let closestTarget = null;
                let closestDist = Infinity;
                let targetType = null;
                
                let tileX = Math.floor(pCX / TILE_SIZE);
                let tileY = Math.floor(pCY / TILE_SIZE);
                
                for (let tr = tileY - 2; tr <= tileY + 2; tr++) {
                    for (let tc = tileX - 2; tc <= tileX + 2; tc++) {
                        let id = tc + "_" + tr;
                        if (trees.has(id)) {
                            let t = trees.get(id);
                            if (t.hp > 0) {
                                let testX = pCX;
                                let testY = pCY;
                                if (pCX < t.x) testX = t.x;
                                else if (pCX > t.x + 128) testX = t.x + 128;
                                if (pCY < t.y) testY = t.y;
                                else if (pCY > t.y + 128) testY = t.y + 128;
                                
                                let dx = testX - pCX;
                                let dy = testY - pCY;
                                let distToAABB = Math.sqrt(dx*dx + dy*dy);
                                
                                if (distToAABB <= hitRange) {
                                    let angleToTree = Math.atan2(t.cy - pCY, t.cx - pCX);
                                    let angleDiff = Math.abs(player.angle - angleToTree);
                                    while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                                    angleDiff = Math.abs(angleDiff);
                                    
                                    if (angleDiff <= hitArc / 2 && distToAABB < closestDist) {
                                        closestDist = distToAABB;
                                        closestTarget = t;
                                        targetType = 'tree';
                                    }
                                }
                            }
                        }
                    }
                }
                
                for (let id in otherPlayers) {
                    let op = otherPlayers[id];
                    if (op.dead) continue;
                    let opCX = op.x + player.width / 2;
                    let opCY = op.y + player.height / 2;
                    
                    let dx = opCX - pCX;
                    let dy = opCY - pCY;
                    let distToAABB = Math.sqrt(dx*dx + dy*dy);
                    
                    if (distToAABB <= hitRange) {
                        let angleToOp = Math.atan2(dy, dx);
                        let angleDiff = Math.abs(player.angle - angleToOp);
                        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                        angleDiff = Math.abs(angleDiff);
                        
                        if (angleDiff <= hitArc / 2 && distToAABB < closestDist) {
                            closestDist = distToAABB;
                            closestTarget = op;
                            closestTarget.id = id;
                            targetType = 'player';
                        }
                    }
                }
                
                if (targetType === 'tree') {
                    closestTarget.hp -= 1;
                    let angleToTree = Math.atan2(closestTarget.cy - pCY, closestTarget.cx - pCX);
                    closestTarget.hitTimer = 0.2;
                    closestTarget.hitAngle = angleToTree;
                    activeTrees.add(closestTarget);
                    
                    playSoundInstance(assets.treeHits, closestTarget.cx, closestTarget.cy);
                    
                    if (closestTarget.hp <= 0) {
                        closestTarget.dead = true;
                        closestTarget.deathTimer = 0.5;
                    }
                    
                    fbUpdate(ref(db), {
                        [`trees/${closestTarget.id}`]: {
                            hp: closestTarget.hp,
                            a: Number(angleToTree.toFixed(2))
                        }
                    }).catch(() => {});
                } else if (targetType === 'player') {
                    let damage = closestTarget.blocking ? 4 : 8;
                    if (player.damageNegationTimer > 0) damage = 0;
                    
                    fbUpdate(ref(db), {
                        [`players/${closestTarget.id}/hitEvent`]: {
                            d: damage,
                            t: Date.now(),
                            a: myPlayerId,
                            ang: player.angle
                        }
                    }).catch(() => {});
                }
            }
        }

        function update(dt) {
            let zoomLerp = Math.min(10 * dt, 1);
            currentZoom += (targetZoom - currentZoom) * zoomLerp; 

            if (gameState === 'MENU') {
                menuAngle += 0.08 * dt; 
            } else if (gameState === 'PLAYING' || gameState === 'DEAD') {
                
                if (player.damageNegationTimer > 0) player.damageNegationTimer -= dt;
                if (player.dead && player.deathTimer > 0) player.deathTimer -= dt;
                
                if (!player.dead) {
                    if (isRightMouseDown && player.swingTimer <= 0) {
                        player.isBlocking = true;
                    } else {
                        player.isBlocking = false;
                    }
                } else {
                    player.isBlocking = false;
                    player.sprintActive = false;
                    keys.w = keys.a = keys.s = keys.d = keys.shift = false;
                }

                if (Math.abs(player.kbVx) > 1 || Math.abs(player.kbVy) > 1) {
                    player.x += player.kbVx * dt;
                    player.y += player.kbVy * dt;
                    
                    let friction = Math.pow(0.02, dt); 
                    player.kbVx *= friction;
                    player.kbVy *= friction;
                } else {
                    player.kbVx = 0;
                    player.kbVy = 0;
                }

                if (player.isBlocking) {
                    player.blockAmount = Math.min(1.0, player.blockAmount + dt * 8.0);
                } else {
                    player.blockAmount = Math.max(0.0, player.blockAmount - dt * 8.0);
                }

                for (let id in otherPlayers) {
                    let op = otherPlayers[id];
                    if (op.blocking) {
                        op.blockAmount = Math.min(1.0, op.blockAmount + dt * 8.0);
                    } else {
                        op.blockAmount = Math.max(0.0, op.blockAmount - dt * 8.0);
                    }
                }

                if (isMouseDown && !player.isBlocking && !player.dead) {
                    attemptAttack();
                }

                for (let i = player.chatMessages.length - 1; i >= 0; i--) {
                    player.chatMessages[i].timer -= dt;
                    if (player.chatMessages[i].timer <= 0) {
                        player.chatMessages.splice(i, 1);
                    }
                }

                for (let id in otherPlayers) {
                    for (let i = otherPlayers[id].chatMessages.length - 1; i >= 0; i--) {
                        otherPlayers[id].chatMessages[i].timer -= dt;
                        if (otherPlayers[id].chatMessages[i].timer <= 0) {
                            otherPlayers[id].chatMessages.splice(i, 1);
                        }
                    }
                }

                let focusX = player.x + (player.width / 2) + cameraPanOffset.x;
                let focusY = player.y + (player.height / 2) + cameraPanOffset.y;
                if (gameState === 'DEAD' && player.killedBy && otherPlayers[player.killedBy]) {
                    focusX = otherPlayers[player.killedBy].x + player.width / 2;
                    focusY = otherPlayers[player.killedBy].y + player.height / 2;
                }

                const visibleWidth = width / currentZoom;
                const visibleHeight = height / currentZoom;
                const startCol = Math.floor((focusX - visibleWidth / 2) / TILE_SIZE) - 2;
                const endCol = Math.ceil((focusX + visibleWidth / 2) / TILE_SIZE) + 2;
                const startRow = Math.floor((focusY - visibleHeight / 2) / TILE_SIZE) - 2;
                const endRow = Math.ceil((focusY + visibleHeight / 2) / TILE_SIZE) + 2;

                for (let r = startRow; r <= endRow; r++) {
                    for (let c = startCol; c <= endCol; c++) {
                        let id = c + "_" + r;
                        if (trees.has(id)) {
                            let t = trees.get(id);
                            if (!t.dead || t.deathTimer > 0) {
                                if (!t.inView) {
                                    t.inView = true;
                                    activeTrees.add(t);
                                }
                            }
                        }
                    }
                }

                for (let t of activeTrees) {
                    if (t.hitTimer > 0) {
                        t.hitTimer -= dt;
                        if (t.hitTimer <= 0) t.hitTimer = 0;
                    }
                    if (t.dead && t.deathTimer > 0) {
                        t.deathTimer -= dt;
                        if (t.deathTimer <= 0) t.deathTimer = 0;
                    }
                    
                    let ptC = Math.floor(t.x / TILE_SIZE);
                    let ptR = Math.floor(t.y / TILE_SIZE);
                    let actuallyInView = (ptC >= startCol && ptC <= endCol && ptR >= startRow && ptR <= endRow);
                    
                    if (actuallyInView && !t.dead) {
                        t.inView = true;
                        if (t.visibleState < 1.0) {
                            t.visibleState += dt * 5.0; 
                            if (t.visibleState > 1.0) t.visibleState = 1.0;
                        }
                    } else {
                        t.inView = false;
                        if (t.visibleState > 0.0) {
                            t.visibleState -= dt * 5.0;
                            if (t.visibleState < 0.0) t.visibleState = 0.0;
                        }
                    }
                    
                    if (!t.inView && t.visibleState === 0 && t.deathTimer <= 0 && t.hitTimer <= 0) {
                        activeTrees.delete(t);
                    }
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.life -= dt;
                    if (p.life <= 0) {
                        particles.splice(i, 1);
                    } else {
                        let ratio = p.life / p.maxLife;
                        if (p.isWater) {
                            p.alpha = ratio * 1.0; 
                            p.size = 24 + (1 - ratio) * 60;
                        } else {
                            p.alpha = ratio * 1.0;
                            p.size = ratio * 48;
                        }
                    }
                }

                if (player.cooldownTimer > 0) player.cooldownTimer -= dt;
                if (player.footstepTimer > 0) player.footstepTimer -= dt;

                if (player.swingTimer > 0) {
                    player.swingTimer += dt;
                    if (player.swingTimer >= player.swingDuration) {
                        player.nextHand = player.nextHand === 'right' ? 'left' : 'right'; 
                        player.swingTimer = 0; 
                    }
                }

                let dx = 0;
                let dy = 0;
                if (!player.dead) {
                    if (keys.w) dy -= 1;
                    if (keys.s) dy += 1;
                    if (keys.a) dx -= 1;
                    if (keys.d) dx += 1;
                }

                if (dx !== 0 && dy !== 0) {
                    const length = Math.sqrt(dx * dx + dy * dy);
                    dx /= length;
                    dy /= length;
                }

                let isMoving = dx !== 0 || dy !== 0;

                if (keys.shift && isMoving && player.energy > 15 && !player.exhausted && !player.isBlocking) {
                    player.sprintActive = true;
                }
                if (!keys.shift || !isMoving || player.energy <= 0 || player.exhausted || player.isBlocking) {
                    player.sprintActive = false;
                }
                
                let tileX = Math.floor((player.x + player.width / 2) / TILE_SIZE);
                let tileY = Math.floor((player.y + player.height / 2) / TILE_SIZE);
                tileX = Math.max(0, Math.min(MAP_COLS - 1, tileX));
                tileY = Math.max(0, Math.min(MAP_ROWS - 1, tileY));
                let currentTile = mapData[tileY * MAP_COLS + tileX]; 
                let isWater = currentTile === 1;

                if (isWater) { 
                    player.speed = player.sprintActive ? 96 : 64;
                } else {
                    player.speed = player.sprintActive ? 288 : 192;
                }

                if (player.isBlocking) {
                    player.speed *= 0.75;
                }

                if (player.sprintActive && !player.isBlocking) {
                    player.energy -= 20 * dt; 
                    player.regenDelay = Math.max(player.regenDelay, 1.5);
                    if (player.energy <= 0) {
                        player.energy = 0;
                        player.exhausted = true;
                        player.regenDelay = 5.0;
                    }
                }

                if (isWater || (player.sprintActive && isMoving)) {
                    player.particleTimer -= dt;
                    if (player.particleTimer <= 0) {
                        particles.push({
                            x: player.x + player.width / 2,
                            y: player.y + player.height / 2,
                            size: 48,
                            alpha: 1.0,
                            life: 0.6,
                            maxLife: 0.6,
                            isWater: isWater
                        });
                        player.particleTimer = isWater && !player.sprintActive ? 0.75 : 0.2;
                    }
                }

                if (!player.dead && player.health < 100) {
                    if (Date.now() - player.lastDamageTime > 15000) {
                        player.health += 5 * dt; 
                        if (player.health > 100) player.health = 100;
                    }
                }

                if (player.regenDelay > 0) {
                    player.regenDelay -= dt;
                    if (player.regenDelay <= 0) {
                        player.exhausted = false;
                    }
                } else {
                    if (!player.sprintActive && player.energy < 100) {
                        player.energy += 15 * dt; 
                        if (player.energy > 100) player.energy = 100;
                    }
                }

                energyFill.style.width = player.energy + '%';
                healthFill.style.width = player.health + '%';

                if (isMoving) {
                    let moveX = dx * player.speed * dt;
                    let moveY = dy * player.speed * dt;

                    player.x += moveX;
                    player.y += moveY;

                    if (player.footstepTimer <= 0) {
                        if (player.currentStepSound) {
                            try { player.currentStepSound.pause(); } catch(e) {}
                            player.currentStepSound = null;
                        }
                        if (isWater) { 
                            player.currentStepSound = playSoundInstance(assets.swimSounds, player.x + player.width / 2, player.y + player.height / 2);
                        } else if (currentTile === 2) { 
                            player.currentStepSound = playSoundInstance(assets.sandSteps, player.x + player.width / 2, player.y + player.height / 2);
                        } else { 
                            player.currentStepSound = playSoundInstance(assets.grassSteps, player.x + player.width / 2, player.y + player.height / 2);
                        }
                        player.footstepTimer = player.sprintActive ? 0.4 : 0.5; 
                    }
                } else {
                    if (player.currentStepSound) {
                        try { 
                            player.currentStepSound.pause();
                            player.currentStepSound.currentTime = 0;
                        } catch(e) {}
                        player.currentStepSound = null;
                    }
                }

                let r = player.width / 2;
                let cx = player.x + r;
                let cy = player.y + r;
                
                let pTileX = Math.floor(cx / TILE_SIZE);
                let pTileY = Math.floor(cy / TILE_SIZE);
                for (let tr = pTileY - 2; tr <= pTileY + 2; tr++) {
                    for (let tc = pTileX - 2; tc <= pTileX + 2; tc++) {
                        let id = tc + "_" + tr;
                        if (trees.has(id)) {
                            let t = trees.get(id);
                            if (t.hp > 0) {
                                let testX = cx;
                                let testY = cy;
                                if (cx < t.x) testX = t.x;
                                else if (cx > t.x + 128) testX = t.x + 128;
                                if (cy < t.y) testY = t.y;
                                else if (cy > t.y + 128) testY = t.y + 128;
                                
                                let distX = cx - testX;
                                let distY = cy - testY;
                                let distance = Math.sqrt(distX*distX + distY*distY);
                                
                                if (distance < r) {
                                    let overlap = r - distance;
                                    if (distance === 0) {
                                        player.y -= overlap;
                                    } else {
                                        player.x += (distX / distance) * overlap;
                                        player.y += (distY / distance) * overlap;
                                    }
                                    cx = player.x + r;
                                    cy = player.y + r;
                                }
                            }
                        }
                    }
                }

                let minRadius = 40;
                for (let id in otherPlayers) {
                    let p = otherPlayers[id];
                    if (p.dead) continue;
                    let pcx = p.x + r;
                    let pcy = p.y + r;
                    
                    let pdx = cx - pcx;
                    let pdy = cy - pcy;
                    let dist = Math.sqrt(pdx*pdx + pdy*pdy);

                    if (dist < minRadius && dist > 0) {
                        let overlap = minRadius - dist;
                        let nx = pdx / dist;
                        let ny = pdy / dist;
                        
                        player.x += nx * overlap;
                        player.y += ny * overlap;
                        
                        cx = player.x + r;
                        cy = player.y + r;
                    }
                }

                for (let id in otherPlayers) {
                    let p = otherPlayers[id];
                    
                    if (p.dead && p.deathTimer > 0) {
                        p.deathTimer -= dt;
                    }

                    let lerpSpeed = 15 * dt;
                    if (p.x === undefined) p.x = p.targetX;
                    if (p.y === undefined) p.y = p.targetY;
                    if (p.angle === undefined) p.angle = p.targetAngle;

                    p.x += (p.targetX - p.x) * lerpSpeed;
                    p.y += (p.targetY - p.y) * lerpSpeed;

                    let diff = p.targetAngle - p.angle;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    p.angle += diff * lerpSpeed;

                    if (p.swingTimer > 0) {
                        p.swingTimer += dt;
                        if (p.swingTimer >= player.swingDuration) {
                            p.nextHand = p.nextHand === 'right' ? 'left' : 'right';
                            p.swingTimer = 0;
                        }
                    }

                    let distMoved = Math.sqrt((p.targetX - p.x)**2 + (p.targetY - p.y)**2);
                    let pIsMoving = distMoved > 2.0;
                    if (p.dead) pIsMoving = false;

                    if (p.footstepTimer > 0) p.footstepTimer -= dt;
                    if (p.particleTimer > 0) p.particleTimer -= dt;

                    let ptX = Math.floor((p.x + r) / TILE_SIZE);
                    let ptY = Math.floor((p.y + r) / TILE_SIZE);
                    ptX = Math.max(0, Math.min(MAP_COLS - 1, ptX));
                    ptY = Math.max(0, Math.min(MAP_ROWS - 1, ptY));
                    let ptTile = mapData[ptY * MAP_COLS + ptX]; 
                    let ptIsWater = ptTile === 1;

                    if (pIsMoving) {
                        if (p.footstepTimer <= 0) {
                            if (p.currentStepSound) {
                                try { p.currentStepSound.pause(); } catch(e) {}
                            }
                            if (ptIsWater) p.currentStepSound = playSoundInstance(assets.swimSounds, p.x + r, p.y + r);
                            else if (ptTile === 2) p.currentStepSound = playSoundInstance(assets.sandSteps, p.x + r, p.y + r);
                            else p.currentStepSound = playSoundInstance(assets.grassSteps, p.x + r, p.y + r);
                            
                            p.footstepTimer = p.sprint ? 0.4 : 0.5;
                        }
                    }

                    if (ptIsWater || (p.sprint && pIsMoving)) {
                        if (p.particleTimer <= 0) {
                            particles.push({
                                x: p.x + r,
                                y: p.y + r,
                                size: 48,
                                alpha: 1.0,
                                life: 0.6,
                                maxLife: 0.6,
                                isWater: ptIsWater
                            });
                            p.particleTimer = ptIsWater && !p.sprint ? 0.75 : 0.2;
                        }
                    }
                }

                const maxX = MAP_COLS * TILE_SIZE - player.width;
                const maxY = MAP_ROWS * TILE_SIZE - player.height;
                player.x = Math.max(0, Math.min(player.x, maxX));
                player.y = Math.max(0, Math.min(player.y, maxY));

                const percentX = (player.x + (player.width / 2)) / (MAP_COLS * TILE_SIZE);
                const percentY = (player.y + (player.height / 2)) / (MAP_ROWS * TILE_SIZE);
                minimapDot.style.left = `${percentX * 100}%`;
                minimapDot.style.top = `${percentY * 100}%`;
                
                coordX.innerText = Math.floor(player.x / TILE_SIZE) - MAP_CENTER;
                coordZ.innerText = Math.floor(player.y / TILE_SIZE) - MAP_CENTER;

                const panRatioX = (mouse.x - (width / 2)) / (width / 2);
                const panRatioY = (mouse.y - (height / 2)) / (height / 2);
                const targetPanX = panRatioX * MAX_PAN;
                const targetPanY = panRatioY * MAX_PAN;

                let panLerp = Math.min(5 * dt, 1);
                cameraPanOffset.x += (targetPanX - cameraPanOffset.x) * panLerp;
                cameraPanOffset.y += (targetPanY - cameraPanOffset.y) * panLerp;

                const screenPlayerX = (width / 2) - (cameraPanOffset.x * currentZoom);
                const screenPlayerY = (height / 2) - (cameraPanOffset.y * currentZoom);
                
                if (!player.dead) {
                    player.angle = Math.atan2(mouse.y - screenPlayerY, mouse.x - screenPlayerX);
                }

                let now = performance.now();
                if (now - lastSyncTime > 50) { 
                    if (isMoving || lastAngle !== player.angle || player.sprintActive !== false || player.forceSync || player.isBlocking || Math.abs(player.kbVx) > 1 || Math.abs(player.kbVy) > 1 || now - lastSyncTime > 3000) {
                        let syncData = {
                            x: Math.round(player.x),
                            y: Math.round(player.y),
                            angle: Number(player.angle.toFixed(2)),
                            name: player.name,
                            sprint: player.sprintActive,
                            attack: player.attackCounter,
                            blocking: player.isBlocking,
                            health: player.health,
                            t: Date.now()
                        };
                        if (player.chatPayload) {
                            syncData.chat = player.chatPayload;
                        }
                        
                        fbUpdate(myPlayerRef, syncData);
                        lastSyncTime = now;
                        lastAngle = player.angle;
                        player.forceSync = false;
                    }
                }
            }
        }

        function drawPreview() {
            const ui = document.getElementById('craftingUI');
            if (gameState !== 'PLAYING' || ui.style.display === 'none') return;
            
            const pCanvas = document.getElementById('previewCanvas');
            const pCtx = pCanvas.getContext('2d');
            
            pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
            
            const centerX = pCanvas.width / 2;
            const centerY = pCanvas.height / 2;
            
            let dpr = window.devicePixelRatio || 1;
            const rect = pCanvas.getBoundingClientRect();
            const mouseX = mouse.x - (rect.left * dpr);
            const mouseY = mouse.y - (rect.top * dpr);
            
            const angle = Math.atan2(mouseY - centerY, mouseX - centerX);
            
            pCtx.save();
            pCtx.translate(centerX, centerY);
            pCtx.rotate(angle);
            
            const baseHandX = 24; 
            const baseHandY = 24; 
            
            let idleOffset = 0;
            if (player.swingTimer <= 0) {
                idleOffset = Math.sin(performance.now() / 400) * 1.5;
            }
            
            pCtx.save();
            pCtx.translate(baseHandX + idleOffset, -baseHandY);
            pCtx.drawImage(assets.leftHand, -player.handSize / 2, -player.handSize / 2, player.handSize, player.handSize);
            pCtx.restore();

            pCtx.save();
            pCtx.translate(baseHandX + idleOffset, baseHandY);
            pCtx.drawImage(assets.rightHand, -player.handSize / 2, -player.handSize / 2, player.handSize, player.handSize);
            pCtx.restore();

            pCtx.save();
            pCtx.translate(idleOffset, 0);
            pCtx.drawImage(assets.playerHead, -player.width / 2, -player.height / 2, player.width, player.height);
            pCtx.restore();
            
            pCtx.restore();
        }

        function drawChatBubble(ctx, text, x, y, timer, maxTime = 4.0, stackIndex = 0) {
            if (timer <= 0) return;
            let alpha = 1.0;
            let slideY = 0;
            
            if (timer > maxTime - 0.2) {
                let progress = (maxTime - timer) / 0.2; 
                alpha = progress;
                slideY = (1 - progress) * 15; 
            } else if (timer < 0.5) {
                alpha = timer / 0.5;
            }
            
            ctx.save();
            ctx.globalAlpha = alpha;
            let yOffset = stackIndex * 38;
            ctx.translate(x, y + slideY - 45 - yOffset); 
            
            ctx.font = 'bold 15px "Segoe UI", sans-serif';
            let metrics = ctx.measureText(text);
            let tw = metrics.width;
            let th = 15;
            let padX = 12;
            let padY = 8;
            
            let bw = tw + padX * 2;
            let bh = th + padY * 2;
            let bx = -bw / 2;
            let by = -bh / 2;
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.beginPath();
            if (ctx.roundRect) {
                ctx.roundRect(bx, by, bw, bh, 8);
            } else {
                ctx.rect(bx, by, bw, bh);
            }
            ctx.fill();
            
            ctx.beginPath();
            ctx.moveTo(-6, by + bh);
            ctx.lineTo(6, by + bh);
            ctx.lineTo(0, by + bh + 6);
            ctx.closePath();
            ctx.fill();
            
            ctx.fillStyle = 'white';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 0, 1);
            
            ctx.restore();
        }

        function draw() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, height);

            let focusX = 0;
            let focusY = 0;

            if (gameState === 'PLAYING' || gameState === 'DEAD') {
                if (gameState === 'DEAD' && player.killedBy && otherPlayers[player.killedBy]) {
                    let killer = otherPlayers[player.killedBy];
                    focusX = killer.x + (player.width / 2);
                    focusY = killer.y + (player.height / 2);
                } else {
                    focusX = player.x + (player.width / 2) + cameraPanOffset.x;
                    focusY = player.y + (player.height / 2) + cameraPanOffset.y;
                }
            } else if (gameState === 'PREVIEW' || gameState === 'SPAWN_PICKER') {
                focusX = previewX;
                focusY = previewZ;
            } else {
                let radiusX = 800; 
                let radiusY = 800;
                focusX = (MAP_CENTER * TILE_SIZE) + Math.cos(menuAngle) * radiusX;
                focusY = (MAP_CENTER * TILE_SIZE) + Math.sin(menuAngle) * radiusY;
            }

            const visibleWidth = width / currentZoom;
            const visibleHeight = height / currentZoom;
            const startCol = Math.max(0, Math.floor((focusX - visibleWidth / 2) / TILE_SIZE) - 1);
            const endCol = Math.min(MAP_COLS - 1, Math.floor((focusX + visibleWidth / 2) / TILE_SIZE) + 1);
            const startRow = Math.max(0, Math.floor((focusY - visibleHeight / 2) / TILE_SIZE) - 1);
            const endRow = Math.min(MAP_ROWS - 1, Math.floor((focusY + visibleHeight / 2) / TILE_SIZE) + 1);

            for (let c = startCol; c <= endCol; c++) {
                for (let r = startRow; r <= endRow; r++) {
                    let tileType = mapData[r * MAP_COLS + c];
                    let sourceX = tileType * TILE_SIZE;

                    let screenX = Math.floor((c * TILE_SIZE - focusX) * currentZoom + width / 2);
                    let screenY = Math.floor((r * TILE_SIZE - focusY) * currentZoom + height / 2);
                    let nextScreenX = Math.floor(((c + 1) * TILE_SIZE - focusX) * currentZoom + width / 2);
                    let nextScreenY = Math.floor(((r + 1) * TILE_SIZE - focusY) * currentZoom + height / 2);
                    
                    let drawW = nextScreenX - screenX;
                    let drawH = nextScreenY - screenY;

                    ctx.drawImage(
                        assets.tilesheet,
                        sourceX, 0, TILE_SIZE, TILE_SIZE, 
                        screenX, screenY, drawW, drawH
                    );
                }
            }

            ctx.save();
            ctx.translate(Math.round(width / 2), Math.round(height / 2));
            ctx.scale(currentZoom, currentZoom);
            ctx.translate(-focusX, -focusY);

            for (let t of activeTrees) {
                if (t.visibleState > 0 || t.deathTimer > 0) {
                    ctx.save();
                    let drawX = t.cx;
                    let drawY = t.cy;
                    
                    if (t.hitTimer > 0) {
                        let bounceDist = Math.sin((t.hitTimer / 0.2) * Math.PI) * 12;
                        drawX += Math.cos(t.hitAngle) * bounceDist;
                        drawY += Math.sin(t.hitAngle) * bounceDist;
                    }
                    
                    ctx.translate(drawX, drawY);
                    
                    let scale = 1.0;
                    let alpha = 1.0;
                    
                    if (t.dead) {
                        let progress = 1.0 - (t.deathTimer / 0.5);
                        scale = t.visibleState + progress * 0.5;
                        alpha = (1.0 - progress) * t.visibleState;
                    } else {
                        scale = t.visibleState;
                        alpha = t.visibleState;
                    }
                    
                    ctx.scale(scale, scale);
                    ctx.globalAlpha = alpha;
                    ctx.drawImage(assets.tree, -64, -64, 128, 128);
                    ctx.restore();
                }
            }

            if (gameState === 'PLAYING' || gameState === 'DEAD') {
                particles.forEach(p => {
                    if (p.isWater) {
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.globalAlpha = p.alpha;
                        ctx.drawImage(assets.sprintParticle, -p.size/2, -p.size/2, p.size, p.size);
                        ctx.beginPath();
                        ctx.arc(0, 0, p.size/2 * 0.8, 0, Math.PI*2);
                        ctx.fillStyle = "rgba(0, 255, 255, " + (p.alpha * 0.4) + ")";
                        ctx.fill();
                        ctx.lineWidth = 2;
                        ctx.strokeStyle = "rgba(0, 255, 255, " + p.alpha + ")";
                        ctx.stroke();
                        ctx.restore();
                    } else {
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.globalAlpha = p.alpha;
                        ctx.drawImage(assets.sprintParticle, -p.size/2, -p.size/2, p.size, p.size);
                        ctx.restore();
                    }
                });

                for (let id in otherPlayers) {
                    let p = otherPlayers[id];
                    ctx.save();
                    ctx.translate(p.x + (player.width / 2), p.y + (player.height / 2));
                    
                    if (p.dead) {
                        let progress = 1.0 - (p.deathTimer / 0.15);
                        if (progress > 1.0) progress = 1.0;
                        ctx.globalAlpha = Math.max(0, 1.0 - progress);
                        let shrink = Math.max(0.01, 1.0 - progress);
                        ctx.scale(shrink, shrink);
                    }

                    let pHeadTilt = 0;
                    let pRightPunch = 0;
                    let pLeftPunch = 0;
                    let pRightInward = 0;
                    let pLeftInward = 0;
                    let pRightHandTilt = 0;
                    let pLeftHandTilt = 0;

                    if (p.swingTimer > 0) {
                        let progress = p.swingTimer / player.swingDuration;
                        let punchExtension = Math.sin(progress * Math.PI); 

                        if (p.nextHand === 'right') {
                            pRightPunch = punchExtension * 24; 
                            pRightInward = punchExtension * -10;    
                            pHeadTilt = punchExtension * -0.25;      
                            pRightHandTilt = punchExtension * -0.5; 
                        } else {
                            pLeftPunch = punchExtension * 24;
                            pLeftInward = punchExtension * 10;      
                            pHeadTilt = punchExtension * 0.25;     
                            pLeftHandTilt = punchExtension * 0.5;   
                        }
                    }
                    
                    let bAmt = p.blockAmount;
                    pRightPunch += 6 * bAmt;
                    pRightInward += -19 * bAmt;
                    pRightHandTilt += -0.8 * bAmt;
                    pLeftPunch += 6 * bAmt;
                    pLeftInward += 19 * bAmt;
                    pLeftHandTilt += 0.8 * bAmt;

                    const baseHandX = 24; 
                    const baseHandY = 24; 
                    let pIdleOffset = p.swingTimer <= 0 && bAmt === 0 ? Math.sin(performance.now() / 400) * 1.5 : 0;

                    ctx.save();
                    ctx.rotate(p.angle);
                    ctx.translate(baseHandX + pLeftPunch + pIdleOffset, -baseHandY + pLeftInward);
                    ctx.rotate(pLeftHandTilt);
                    ctx.drawImage(
                        assets.leftHand,
                        -player.handSize / 2, -player.handSize / 2, player.handSize, player.handSize
                    );
                    ctx.restore();

                    ctx.save();
                    ctx.rotate(p.angle);
                    ctx.translate(baseHandX + pRightPunch + pIdleOffset, baseHandY + pRightInward);
                    ctx.rotate(pRightHandTilt);
                    ctx.drawImage(
                        assets.rightHand,
                        -player.handSize / 2, -player.handSize / 2, player.handSize, player.handSize
                    );
                    ctx.restore();

                    ctx.save();
                    ctx.rotate(p.angle + pHeadTilt);
                    ctx.translate(pIdleOffset, 0);
                    ctx.drawImage(
                        assets.playerHead,
                        -player.width / 2, -player.height / 2, player.width, player.height
                    );
                    ctx.restore();
                    ctx.restore();
                    
                    if (!p.dead) {
                        ctx.font = 'bold 15px "Segoe UI", sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillStyle = 'white';
                        ctx.fillText(p.name, p.x + (player.width / 2), p.y + player.height + 25);
                        
                        if (p.chatMessages) {
                            for (let i = p.chatMessages.length - 1; i >= 0; i--) {
                                let msgObj = p.chatMessages[i];
                                let stackIndex = p.chatMessages.length - 1 - i; 
                                drawChatBubble(ctx, msgObj.msg, p.x + (player.width / 2), p.y, msgObj.timer, msgObj.maxTime, stackIndex);
                            }
                        }
                    }
                }

                ctx.save();
                ctx.translate(player.x + (player.width / 2), player.y + (player.height / 2));
                
                if (player.dead) {
                    let progress = 1.0 - (player.deathTimer / 0.15);
                    if (progress > 1.0) progress = 1.0;
                    ctx.globalAlpha = Math.max(0, 1.0 - progress);
                    let shrink = Math.max(0.01, 1.0 - progress);
                    ctx.scale(shrink, shrink);
                }

                let headTilt = 0;
                let rightPunch = 0;
                let leftPunch = 0;
                let rightInward = 0;
                let leftInward = 0;
                let rightHandTilt = 0;
                let leftHandTilt = 0;

                if (player.swingTimer > 0) {
                    let progress = player.swingTimer / player.swingDuration;
                    let punchExtension = Math.sin(progress * Math.PI); 

                    if (player.nextHand === 'right') {
                        rightPunch = punchExtension * 24; 
                        rightInward = punchExtension * -10;    
                        headTilt = punchExtension * -0.25;      
                        rightHandTilt = punchExtension * -0.5; 
                    } else {
                        leftPunch = punchExtension * 24;
                        leftInward = punchExtension * 10;      
                        headTilt = punchExtension * 0.25;     
                        leftHandTilt = punchExtension * 0.5;   
                    }
                }

                let bAmt = player.blockAmount;
                rightPunch += 6 * bAmt;
                rightInward += -19 * bAmt;
                rightHandTilt += -0.8 * bAmt;
                leftPunch += 6 * bAmt;
                leftInward += 19 * bAmt;
                leftHandTilt += 0.8 * bAmt;

                const baseHandX = 24; 
                const baseHandY = 24; 
                let idleOffset = player.swingTimer <= 0 && bAmt === 0 ? Math.sin(performance.now() / 400) * 1.5 : 0;

                ctx.save();
                ctx.rotate(player.angle);
                ctx.translate(baseHandX + leftPunch + idleOffset, -baseHandY + leftInward); 
                ctx.rotate(leftHandTilt); 
                ctx.drawImage(
                    assets.leftHand,
                    -player.handSize / 2, -player.handSize / 2, player.handSize, player.handSize
                );
                ctx.restore();

                ctx.save();
                ctx.rotate(player.angle);
                ctx.translate(baseHandX + rightPunch + idleOffset, baseHandY + rightInward); 
                ctx.rotate(rightHandTilt); 
                ctx.drawImage(
                    assets.rightHand,
                    -player.handSize / 2, -player.handSize / 2, player.handSize, player.handSize
                );
                ctx.restore();

                ctx.save();
                ctx.rotate(player.angle + headTilt); 
                ctx.translate(idleOffset, 0);
                ctx.drawImage(
                    assets.playerHead,
                    -player.width / 2, -player.height / 2, player.width, player.height
                );
                ctx.restore();
                
                ctx.restore(); 

                if (!player.dead) {
                    ctx.font = 'bold 15px "Segoe UI", sans-serif';
                    ctx.textAlign = 'center';
                    
                    const textX = player.x + (player.width / 2);
                    const textY = player.y + player.height + 25;
                    
                    ctx.fillStyle = 'white';
                    ctx.fillText(player.name, textX, textY);
                    
                    if (player.chatMessages) {
                        for (let i = player.chatMessages.length - 1; i >= 0; i--) {
                            let msgObj = player.chatMessages[i];
                            let stackIndex = player.chatMessages.length - 1 - i; 
                            drawChatBubble(ctx, msgObj.msg, textX, player.y, msgObj.timer, msgObj.maxTime, stackIndex);
                        }
                    }
                }
            }

            ctx.restore();
        }

        let lastLogicTime = 0;

        function logicLoop() {
            let now = performance.now();
            let dt = (now - lastLogicTime) / 1000;
            lastLogicTime = now;

            if (dt > 2.0) dt = 2.0;

            while (dt > 0) {
                let step = Math.min(dt, 0.05); 
                update(step);
                dt -= step;
            }
        }

        let frames = 0;
        let lastFpsTime = performance.now();
        let currentFps = 0;

        function renderLoop() {
            frames++;
            let now = performance.now();
            if (now - lastFpsTime >= 1000) {
                currentFps = frames;
                frames = 0;
                lastFpsTime = now;
                let fpsEl = document.getElementById('fpsValue');
                if (fpsEl) fpsEl.innerText = currentFps;
            }
            
            draw();
            drawPreview();
            requestAnimationFrame(renderLoop);
        }

        const craftBtnContainer = document.getElementById('craftBtnContainer');
        craftBtnContainer.addEventListener('click', () => {
            if (gameState === 'PLAYING') {
                let ui = document.getElementById('craftingUI');
                ui.style.display = (ui.style.display === 'none' || ui.style.display === '') ? 'flex' : 'none';
            }
        });
    </script>
</body>
</html>
